<!-- Obere Toolbar: Titel + Gatter-Palette + I/O + Simulations-Toggle -->
<header class="toolbar-top">

  <div class="app-title">GatterPLUS</div>

  <div class="divider"></div>

  <!-- Gatter-Palette -->
  <div class="palette-group">
    <span class="group-label">Gatter</span>
    <div class="palette-items">

      <!-- AND-Gatter -->
      <div class="palette-item" title="UND-Gatter (AND) ziehen" (mousedown)="onGateMouseDown($event, 'and')">
        <app-and-gate [toolbarMode]="true"></app-and-gate>
        <span class="item-name">AND</span>
      </div>

      <!-- OR-Gatter -->
      <div class="palette-item" title="ODER-Gatter (OR) ziehen" (mousedown)="onGateMouseDown($event, 'or')">
        <app-or-gate [toolbarMode]="true"></app-or-gate>
        <span class="item-name">OR</span>
      </div>

      <!-- NOT-Gatter -->
      <div class="palette-item" title="NICHT-Gatter (NOT) ziehen" (mousedown)="onGateMouseDown($event, 'not')">
        <app-not-gate [toolbarMode]="true"></app-not-gate>
        <span class="item-name">NOT</span>
      </div>

    </div>
  </div>

  <div class="divider"></div>

  <!-- I/O-Palette -->
  <div class="palette-group">
    <span class="group-label">Ein/Ausgang</span>
    <div class="palette-items">

      <!-- Eingangs-Schalter -->
      <div class="palette-item" title="Eingangs-Schalter ziehen (gibt Signal 0 oder 1 aus)" (mousedown)="onGateMouseDown($event, 'input')">
        <app-input-switch [toolbarMode]="true"></app-input-switch>
        <span class="item-name">Eingang</span>
      </div>

      <!-- Ausgangs-LED -->
      <div class="palette-item" title="Ausgangs-LED ziehen (zeigt empfangenes Signal an)" (mousedown)="onGateMouseDown($event, 'output')">
        <app-output-led [toolbarMode]="true"></app-output-led>
        <span class="item-name">Ausgang</span>
      </div>

    </div>
  </div>

  <!-- Spacer schiebt Simulations-Button nach rechts -->
  <div class="spacer"></div>

  <!-- Simulations-Toggle: Start / Stop -->
  <button
    class="sim-btn"
    [class.active]="simulationMode"
    title="{{ simulationMode ? 'Simulation stoppen (F5)' : 'Simulation starten (F5)' }}"
    (click)="simulationToggle.emit()"
  >
    {{ simulationMode ? '⏹ Stop' : '▶ Start' }}
  </button>

</header>
